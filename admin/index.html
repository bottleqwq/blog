<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瓶子的博客工坊</title><link rel="stylesheet" href="admin.css"></head>
<body>
  <header class="topbar"><div><span class="brand-mark">B</span><strong>博客工坊</strong><span class="sub">可视化内容管理</span></div><div class="actions"><span id="state">准备就绪</span><button id="previewBtn" class="ghost">预览页面</button><button id="saveBtn" class="primary">保存修改</button></div></header>
  <main>
    <aside class="sidebar"><div class="side-title"><span>页面</span><button id="newPage" title="新建页面">＋</button></div><nav id="pages"></nav><div class="tip"><b>使用提示</b><p>在中间预览中点击卡片、标题或文字，然后在右侧修改。保存前会自动备份原文件。</p></div></aside>
    <section class="workspace"><div class="canvasbar"><span><i></i> 实时页面</span><div><button data-width="390">手机</button><button data-width="768">平板</button><button data-width="100%" class="active">桌面</button></div></div><div class="canvas"><iframe id="preview" title="页面预览"></iframe></div></section>
    <aside class="inspector"><div id="empty"><div class="empty-icon">✦</div><h2>选择一个内容块</h2><p>点击预览中的文字、图片或卡片开始编辑</p></div><div id="editor" hidden><div class="eyebrow">正在编辑</div><h2 id="elementName">内容</h2><label>文字内容<textarea id="textValue" rows="5"></textarea></label><label id="imageRow">图片地址<input id="imageValue" type="text" placeholder="https://… 或本地路径"></label><label id="linkRow">链接地址<input id="linkValue" type="text" placeholder="页面或网址"></label><label>布局样式<select id="sizeValue"><option value="">普通</option><option value="span-2">横向加宽</option><option value="span-row-2">纵向加高</option><option value="span-2 span-row-2">大型卡片</option></select></label><div class="edit-actions"><button id="duplicate">复制卡片</button><button id="remove" class="danger">删除</button></div></div></aside>
  </main><div id="toast"></div>
  <script type="module" src="admin.js"></script>
</body></html>
