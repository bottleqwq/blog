<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC | 调校的歌曲</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet">
    <style>
        .glass-overlay {
            opacity: 1 !important;
            pointer-events: auto !important;
            padding-top: 0 !important;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(25px);
        }
    </style>
</head>
<body>

    <img id="bg-img" src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/主页图片/bg.jpeg" alt="Background">

    <div class="glass-overlay">
        <div class="content-container">
            
            <header class="header">
                <div>
                    <h1>调校的歌曲</h1>
                    <p style="color: var(--text-sub); margin-top: 5px;">代码与灵感的结晶</p>
                </div>
                <a href="index.html" class="back-btn">← 返回主页</a>
            </header>

            <!-- 列表区域：点击卡片触发 openDetail() -->
            <div class="bento-grid">

                <!-- 项目 1 -->
                <div class="card interactive span-2 span-row-2" onclick="openDetail('project1')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/主页图片/bg.jpeg" loading="lazy">
                    <div class="card-tag">洛天依</div>
                    <h3>千里饿殍行</h3>
                    <p style="color: #ccc; font-size: 0.9rem; margin-top: 10px;"></p>
                </div>

                <!-- 项目 2 -->
                <div class="card interactive span-2 span-row-2" onclick="openDetail('project2')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/夏天的风.png" loading="lazy">
                    <div class="card-tag">洛天依</div>
                    <h3>夏天的风</h3>
                </div>

                <!-- 项目 3 -->
                <div class="card interactive" onclick="openDetail('project3')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/洛天依1.jpeg" loading="lazy">
                    <div class="card-tag">洛天依</div>
                    <h3>あいつら全員同窓会</h3>
                </div>

                <!-- 项目 4 -->
                <div class="card interactive" onclick="openDetail('project4')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/洛天依2.jpeg" loading="lazy">
                    <div class="card-tag">洛天依</div>
                    <h3>小星星</h3>
                </div>

                <!-- 项目 5 -->
                <div class="card interactive" onclick="openDetail('project5')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/洛天依3.jpeg" loading="lazy">
                    <div class="card-tag">洛天依</div>
                    <h3>生日祝福歌</h3>
                </div>
            </div>

            <footer style="margin-top: 4rem; text-align: center; color: var(--text-sub); font-size: 0.8rem;">
                © 2026 瓶子|个人空间
            </footer>
        </div>
    </div>

    <!-- === 详情大弹窗 === -->
    <div id="detail-modal" class="modal-overlay" onclick="closeDetail(event)">
        <div class="modal-large-content">
            <!-- 关闭按钮 -->
            <div style="position: absolute; top: 20px; right: 20px; z-index: 10; cursor: pointer;" onclick="closeDetail(event, true)">
                <i class="ri-close-circle-fill" style="font-size: 2rem; color: rgba(255,255,255,0.8);"></i>
            </div>

            <div class="project-detail-layout">
                <!-- 左侧：媒体区 (JS 动态填充) -->
                <div class="project-media" id="modal-media">
                    <!-- 视频或图片将在这里生成 -->
                </div>

                <!-- 右侧：信息区 -->
                <div class="project-info">
                    <div class="project-meta" id="modal-tags">
                        <!-- 标签将在这里生成 -->
                    </div>
                    <h2 class="project-title" id="modal-title">标题</h2>
                    <p class="project-desc" id="modal-desc">
                        描述内容...
                    </p>

                    <div class="project-actions" id="modal-actions">
                        <!-- 按钮将在这里生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 数据配置区 (这是你最需要修改的地方) ---
        // 注意：B站 iframe 需要 high_quality=1 和 allowfullscreen
        const projectsData = {
            'project1': {
                title: "千里饿殍行",
                tags: ["洛天依Ning"],
                desc: "原作：《饿殍：明末千里行》\n作曲：塔库\n作词：嵇零 Hanser\n演唱：Hanser\n编曲/分轨：向往\n二胡：二胡妹\n吉他：大牛\n\n翻唱：洛天依\n调教：瓶子",
                mediaType: 'video', 
                mediaContent: '<iframe controls src="https://www.bilibili.com/video/BV1CEFkzgE62?t=0.0" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>',
                links: []
            },
            'project2': {
                title: "夏天的风",
                tags: ["洛天依Ning"],
                desc: "原创：温岚\n翻唱：洛天依Ning\n调教：瓶子\n曲绘：肆有",
                mediaType: 'video',
                mediaContent: '<iframe controls src="https://www.bilibili.com/video/BV1mgFkz1EhM?t=0.0" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>',
                links: []
            },
            'project3': {
                title: "あいつら全員同窓会",
                tags: ["洛天依Ning", "片段"],
                desc: "用的中V声库调的日语歌",
                mediaType: 'video',
                mediaContent: '<video controls src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/那些家伙们的校友会.mp4" style="width:100%; height:100%; object-fit:contain;"></video>',
                links: []
            },
             'project4': {
                title: "小星星",
                tags: ["洛天依Meng"],
                desc: "儿歌小星星",
                mediaType: 'video',
                mediaContent: '<video controls src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/小星星.mp4" style="width:100%; height:100%; object-fit:contain;"></video>',
                links: []
            },
             'project5': {
                title: "生日祝福歌",
                tags: ["洛天依Ning","片段"],
                desc: "生日祝福歌",
                mediaType: 'video',
                mediaContent: '<video controls src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/音乐图片/生日祝福歌.mp4" style="width:100%; height:100%; object-fit:contain;"></video>',
                links: []
            }
        };

        const modal = document.getElementById('detail-modal');
        const modalMedia = document.getElementById('modal-media');
        const modalTitle = document.getElementById('modal-title');
        const modalTags = document.getElementById('modal-tags');
        const modalDesc = document.getElementById('modal-desc');
        const modalActions = document.getElementById('modal-actions');

        // 打开弹窗
        function openDetail(id) {
            const data = projectsData[id];
            if(!data) return;

            // 1. 设置标题和描述
            modalTitle.textContent = data.title;
            modalDesc.innerText = data.desc; // innerText 保留换行符

            // 2. 生成标签
            modalTags.innerHTML = data.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('');

            // 3. 设置媒体 (视频或图片)
            if(data.mediaType === 'video') {
                modalMedia.innerHTML = `<div class="video-wrapper">${data.mediaContent}</div>`;
            } else {
                modalMedia.innerHTML = data.mediaContent;
            }

            // 4. 生成按钮
            modalActions.innerHTML = data.links.map(link => `
                <a href="${link.url}" target="_blank" class="action-btn ${link.type === 'primary' ? 'btn-primary' : 'btn-secondary'}">
                    ${link.text} <i class="ri-arrow-right-up-line"></i>
                </a>
            `).join('');

            modal.classList.add('active');
        }

        // 关闭弹窗
        function closeDetail(event, force = false) {
            if (force || event.target === modal) {
                modal.classList.remove('active');
                
                // 关键：关闭时清空媒体区，以停止视频播放（否则关掉弹窗声音还在响）
                setTimeout(() => {
                    modalMedia.innerHTML = '';
                }, 300); // 等动画播完再清空
            }
        }
    </script>
</body>
</html>
