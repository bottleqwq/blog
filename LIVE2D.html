<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE2D | Live2d作品</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet">
    <style>
        /* 视频弹窗：全屏视频，无右侧信息区 */
        .modal-video-content {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 0;
            width: 90%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .modal-overlay.active .modal-video-content {
            transform: scale(1);
        }
        .modal-video-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        .modal-video-content .close-btn-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            cursor: pointer;
            font-size: 2rem;
            color: rgba(255,255,255,0.8);
            transition: color 0.3s;
            line-height: 1;
        }
        .modal-video-content .close-btn-overlay:hover {
            color: #fff;
        }
    </style>
</head>
<body class="subpage">

    <img id="bg-img" src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/主页图片/bg.webp" alt="Background">

    <div class="glass-overlay">
        <div class="content-container">
            
             <header class="header">
                <div>
                    <h1>Live2d作品</h1>
                    <p style="color: var(--text-sub); margin-top: 5px;">让插画在呼吸间活过来</p>
                </div>
                <a href="index.html" class="back-btn">← 返回主页</a>
            </header>

            <!-- 卡片列表：点击打开视频 -->
            <div class="bento-grid">

                <!-- LIVE2D 1 -->
                <div class="card interactive span-2 span-row-2" onclick="openVideo('LIVE2D图片/LIVE2D1.mp4')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/LIVE2D图片/LIVE2D1.webp" loading="lazy">
                </div>

                <!-- LIVE2D 2 -->
                <div class="card interactive span-2 span-row-2" onclick="openVideo('LIVE2D图片/LIVE2D2.mp4')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/LIVE2D图片/LIVE2D2.webp" loading="lazy">
                </div>

                <!-- LIVE2D 3 -->
                <div class="card interactive span-2 span-row-2" onclick="openVideo('LIVE2D图片/LIVE2D3.mp4')">
                    <img src="https://cdn.jsdelivr.net/gh/bottleqwq/blog@main/LIVE2D图片/LIVE2D3.webp" loading="lazy">
                </div>

            </div>

            <footer style="margin-top: 4rem; text-align: center; color: var(--text-sub); font-size: 0.8rem;">
                © 2026 瓶子|个人空间
            </footer>
        </div>
    </div>

    <!-- === 纯视频弹窗 === -->
    <div id="video-modal" class="modal-overlay" onclick="closeVideo(event)">
        <div class="modal-video-content">
            <!-- 关闭按钮 -->
            <div class="close-btn-overlay" onclick="closeVideo(event, true)">
                <i class="ri-close-circle-fill"></i>
            </div>
            <video id="modal-video" controls preload="metadata"></video>
        </div>
    </div>

    <script>
        const modal = document.getElementById('video-modal');
        const videoEl = document.getElementById('modal-video');

        function openVideo(src) {
            videoEl.src = src;
            modal.classList.add('active');
            // 等弹窗动画完成后自动播放
            setTimeout(() => {
                videoEl.play().catch(() => {});
            }, 350);
        }

        function closeVideo(event, force = false) {
            if (force || event.target === modal) {
                modal.classList.remove('active');
                // 延迟暂停并清空 src，停止视频播放/音频
                setTimeout(() => {
                    videoEl.pause();
                    videoEl.src = '';
                }, 300);
            }
        }
    </script>
</body>
</html>
